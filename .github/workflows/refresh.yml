name: Refresh apartment listings

on:
  schedule:
    - cron: "30 4 * * *"      # 04:30 UTC = 06:30 Sweden (summer). Daily.
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: [watch.py, build_site.py, .github/workflows/refresh.yml]

permissions:
  contents: write             # to commit the regenerated page + state

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Scrape + build page
        run: |
          uv run watch.py
          python3 build_site.py

      - name: Commit changes
        run: |
          git config user.name "hem-watch-bot"
          git config user.email "actions@github.com"
          git add docs matches.json seen_ids.json desc_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh listings ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi
